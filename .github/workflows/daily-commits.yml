name: Daily Git Commit Automator

'on':
  schedule:
    # Runs once every 24 hours at 00:00 UTC
    # Note: GitHub Actions scheduled jobs can experience queue delays of a few minutes
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (discover repositories without committing or pushing)'
        required: false
        default: false
        type: boolean
      include_forks:
        description: 'Include forked repositories'
        required: false
        default: false
        type: boolean
      commit_message:
        description: 'Custom commit message'
        required: false
        default: 'chore: daily automated commit'
        type: string

concurrency:
  group: daily-commits
  cancel-in-progress: false

jobs:
  daily-commits:
    name: Run Daily Commits Across Repositories
    runs-on: ubuntu-latest

    permissions:
      contents: read # Read permission for checking out this automation repository

    steps:
      - name: Checkout Automation Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Daily Commit Automation
        env:
          AUTO_COMMIT_PAT: ${{ secrets.AUTO_COMMIT_PAT }}
          DRY_RUN: "${{ inputs.dry_run }}"
          INCLUDE_FORKS: "${{ inputs.include_forks }}"
          COMMIT_MSG: "${{ inputs.commit_message }}"
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "$INCLUDE_FORKS" = "true" ]; then
            ARGS="$ARGS --include-forks"
          fi
          if [ -n "$COMMIT_MSG" ]; then
            ARGS="$ARGS --message \"$COMMIT_MSG\""
          fi

          python commit_automator.py $ARGS
